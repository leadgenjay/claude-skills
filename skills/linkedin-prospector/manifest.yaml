id: linkedin-prospector
type: skill
name: "LinkedIn Prospector"
description: "Find the LinkedIn creators your buyers follow, pull the people commenting on their posts, score each against your ideal customer, write a personal welcome message, and load them into an Aimfox campaign that sends a blank connection request and then that message. Stores everything in your own Supabase, with hard Apify spend caps."
categories: [lgj-exclusive, marketing, automation]
tags: [linkedin, aimfox, apify, supabase, prospecting, lead-generation, outbound, connection-requests]
