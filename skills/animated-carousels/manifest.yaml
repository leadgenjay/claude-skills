id: animated-carousels
type: skill
kind: package
version: "1.0.1"
name: "Animated Carousels"
icon: Layers
description: >-
  Instagram carousels built as HTML slides from a bundled design library, checked word for word,
  passed through a blind review, then turned into silent 1080x1440 MP4s with HyperFrames. Ships
  render.mjs, animate.mjs, the library, OFL fonts and a seven-slide example deck.
categories:
  - content
  - design
tags:
  - instagram
  - carousel
  - animation
  - hyperframes
  - playwright
  - social-media
postInstall: |
  command -v ffmpeg >/dev/null 2>&1 || { command -v brew >/dev/null 2>&1 && brew install ffmpeg || echo "  install ffmpeg manually (apt, yum or choco); animated decks need ffmpeg and ffprobe"; }
