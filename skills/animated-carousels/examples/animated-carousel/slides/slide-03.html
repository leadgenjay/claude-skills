<style>
  .top { position: absolute; left: 60px; top: 60px; right: 60px; z-index: 2; }
  .h { font-size: 136px; }
  .h .sel { margin-top: 14px; }
  .body { margin-top: 30px; }

  /* The corpus behind the formula: a faded wall of small slides */
  .wall { position: absolute; z-index: 0; left: 60px; right: 60px; top: 600px; bottom: 60px; border-radius: 24px; overflow: hidden; background: #fff;
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 30%, transparent 78%);
            mask-image: radial-gradient(ellipse at 50% 55%, #000 30%, transparent 78%); }
  .wall svg { display: block; width: 100%; height: 100%; opacity: 0.5; }
  /* The row rises; the chip is centred by layout, not by a transform, so the moving layer never
   * sits at a half pixel (a translateX(-50%) chip failed the determinism check) */
  .count-row { position: absolute; z-index: 3; left: 0; right: 0; top: 680px; display: flex; justify-content: center; }
  .count { padding: 14px 30px 13px; border-radius: 999px;

    box-shadow: 0 16px 36px -18px rgba(15, 23, 42, .35); }

  /* The plan: eight slides in a row, a ninth dropped */
  .row { position: absolute; z-index: 2; left: 60px; right: 60px; top: 880px; display: flex; gap: 10px; }
  .s { flex: none; width: 96px; height: 128px; border-radius: 12px; background: #fff; border: 2px solid #0b0b0b;
    box-shadow: 4px 4px 0 #0b0b0b; display: grid; place-items: center; font: 900 58px/1 var(--font-head); color: #0b0b0b; }
  .s.cut { background: transparent; border: 2px dashed #9ca3af; box-shadow: none; color: #9ca3af; position: relative; }
  /* dropped: a small pink cross badge on the corner, clear of the numeral */
  .x { position: absolute; z-index: 3; right: 60px; top: 856px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: 3px solid #0b0b0b; display: grid; place-items: center; }
  .x svg { width: 20px; height: 20px; }
</style>
