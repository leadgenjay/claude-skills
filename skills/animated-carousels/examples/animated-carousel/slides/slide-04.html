<style>
  .top { position: absolute; left: 60px; top: 60px; right: 60px; }
  .h { font-size: 136px; }
  .h .sel { margin-top: 14px; }
  .body { margin-top: 30px; }

  /* The story: eight small slides in reading order, each named by its job */
  .story { position: absolute; left: 60px; right: 60px; top: 680px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 46px 22px; }
  .beat { position: relative; height: 270px; border-radius: 18px; background: #fff; border: 2px solid #e2e8f0;
    box-shadow: 0 18px 40px -24px rgba(15, 23, 42, .35); display: flex; flex-direction: column; justify-content: space-between; padding: 20px 18px 18px; }
  .beat .bars { display: flex; flex-direction: column; gap: 9px; }
  .beat .bars i { display: block; height: 12px; border-radius: 4px; background: #cbd5e1; }
  .beat .bars i:first-child { height: 18px; background: #94a3b8; }
  .word { font: 900 50px/1 var(--font-head); letter-spacing: 0.01em; color: #0b0b0b; text-transform: uppercase; }
  .beat.fix .word { color: #374151; }
  .beat.first { border-color: #0b0b0b; box-shadow: 6px 6px 0 #0b0b0b; }
  .beat.end { border-color: #0b0b0b; box-shadow: 6px 6px 0 #0b0b0b; }
  .beat.end .word { color: #0b0b0b; }
  /* reading order: a short arrow between neighbours */
  .beat:not(:nth-child(4n)):not(:last-child)::after { content: ''; position: absolute; right: -19px; top: 50%; width: 16px; height: 4px; background: #94a3b8; border-radius: 2px; }
</style>
