id: ultraskill
type: skill
name: Ultraskill
version: "2.0"
description: "One front door for making creative output and the skills that produce it better. Picks a pathway from the session: polish one finished creative and regenerate it; heal a skill by tracing blatant defects in its output back to the rules that allowed them; learn a skill through an eval-driven mutation loop until its pass rate stops rising; or create a skill with skill-creator and then improve it. One skill in place of the three it replaced."
categories:
  - productivity
  - quality
tags:
  - skill-improvement
  - self-healing
  - defect-detection
  - creative-quality
  - mutation
  - closed-loop
  - evals
  - autoresearch
icon: HeartPulse
files:
  - SKILL.md
  - manifest.yaml
  - references/polish.md
  - references/heal.md
  - references/learn.md
  - references/create.md
  - references/mutation-strategies.md
  - references/assertion-patterns.md
  - references/blatant-defect-catalog.md
  - references/defect-to-skill-mapping.md
  - references/banned-words.md
